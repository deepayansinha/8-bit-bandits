<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskForge — Choose Your Action</title>
  <meta name="description" content="TaskForge app dashboard. Upload documents, chat with AI, or browse your documents.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #050c14;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #00f2fe;
      --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Animated background ── */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(0,242,254,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(79,172,254,0.06) 0%, transparent 65%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(5,12,20,0.95) 0%, transparent 100%);
    }

    /* Floating orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: orb-float 12s ease-in-out infinite alternate;
      opacity: 0.4;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,242,254,0.18) 0%, transparent 70%);
      top: -150px; left: -100px;
      animation-duration: 14s;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(79,172,254,0.15) 0%, transparent 70%);
      bottom: -100px; right: -80px;
      animation-duration: 10s;
      animation-delay: -5s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(0,242,254,0.1) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-duration: 16s;
      animation-delay: -8s;
    }

    @keyframes orb-float {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    /* Grid pattern overlay */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,242,254,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,242,254,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }

    /* ── Back button ── */
    .back-btn {
      position: fixed;
      top: 28px;
      left: 32px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      transition: color 0.25s, border-color 0.25s, background 0.25s, transform 0.25s;
    }
    .back-btn:hover {
      color: var(--accent-color);
      border-color: rgba(0,242,254,0.3);
      background: rgba(0,242,254,0.06);
      transform: translateX(-3px);
    }
    .back-btn svg { width: 16px; height: 16px; }

    /* ── Main layout ── */
    .page-wrapper {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 60px;
      gap: 56px;
    }

    /* ── Header ── */
    .page-header {
      text-align: center;
      animation: fade-up 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    .header-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-color);
      margin-bottom: 16px;
      opacity: 0.85;
    }
    .header-eyebrow::before,
    .header-eyebrow::after {
      content: '';
      width: 24px; height: 1px;
      background: var(--accent-gradient);
      opacity: 0.7;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -1.5px;
      background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .page-subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 400;
      max-width: 420px;
      line-height: 1.6;
    }

    /* ── Buttons container ── */
    .buttons-grid {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
      max-width: 720px;
    }

    /* ── Each action card / button ── */
    .action-card {
      position: relative;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(10,20,35,0.5);
      backdrop-filter: blur(16px);
      overflow: hidden;
      transition:
        transform 0.35s cubic-bezier(0.34,1.56,0.64,1),
        border-color 0.3s ease,
        box-shadow 0.35s ease;
      animation: fade-up 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
      text-decoration: none;
      display: block;
    }

    .action-card:nth-child(1) { animation-delay: 0.1s; }
    .action-card:nth-child(2) { animation-delay: 0.22s; }
    .action-card:nth-child(3) { animation-delay: 0.34s; }

    /* Glow border on hover — colour per card */
    .action-card.card-upload:hover  { border-color: rgba(0,242,254,0.4); box-shadow: 0 0 40px rgba(0,242,254,0.18), 0 20px 50px rgba(0,0,0,0.5); transform: translateY(-6px) scale(1.012); }
    .action-card.card-chat:hover    { border-color: rgba(79,172,254,0.5); box-shadow: 0 0 40px rgba(79,172,254,0.22), 0 20px 50px rgba(0,0,0,0.5); transform: translateY(-6px) scale(1.012); }
    .action-card.card-docs:hover    { border-color: rgba(218,165,32,0.4); box-shadow: 0 0 40px rgba(218,165,32,0.18), 0 20px 50px rgba(0,0,0,0.5); transform: translateY(-6px) scale(1.012); }

    .action-card:active { transform: translateY(-2px) scale(1.005); }

    /* Shimmer sweep on hover */
    .action-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.05) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }
    .action-card:hover::after { transform: translateX(100%); }

    /* Button image */
    .action-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      object-position: center;
      display: block;
      border-radius: 16px;
      transition: transform 0.5s ease, filter 0.4s ease;
    }
    .action-card:hover .action-img {
      transform: scale(1.04);
      filter: brightness(1.08) saturate(1.1);
    }

    /* Label strip below image */
    .action-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
    }

    .label-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .label-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-upload .label-icon { background: rgba(0,242,254,0.12); }
    .card-chat   .label-icon { background: rgba(79,172,254,0.12); }
    .card-docs   .label-icon { background: rgba(218,165,32,0.12); }

    .label-icon svg { width: 20px; height: 20px; }
    .card-upload .label-icon svg { color: #00f2fe; }
    .card-chat   .label-icon svg { color: #4facfe; }
    .card-docs   .label-icon svg { color: goldenrod; }

    .label-text-group { display: flex; flex-direction: column; gap: 2px; }

    .label-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.3px;
    }

    .label-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .label-arrow {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.3s, background 0.3s, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .label-arrow svg { width: 16px; height: 16px; color: var(--text-secondary); transition: color 0.3s; }

    .card-upload:hover .label-arrow { border-color: rgba(0,242,254,0.5); background: rgba(0,242,254,0.1); transform: translateX(4px); }
    .card-upload:hover .label-arrow svg { color: #00f2fe; }
    .card-chat:hover   .label-arrow { border-color: rgba(79,172,254,0.5); background: rgba(79,172,254,0.1); transform: translateX(4px); }
    .card-chat:hover   .label-arrow svg { color: #4facfe; }
    .card-docs:hover   .label-arrow { border-color: rgba(218,165,32,0.5); background: rgba(218,165,32,0.08); transform: translateX(4px); }
    .card-docs:hover   .label-arrow svg { color: goldenrod; }

    /* ── Animations ── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (min-width: 760px) {
      .action-img { height: 180px; }
    }
    @media (max-width: 480px) {
      .action-img { height: 120px; }
      .label-desc { display: none; }
    }
  </style>
</head>
<body>

  <!-- Animated Background -->
  <div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Back button -->
  <a href="./index.html" class="back-btn" id="back-home-btn" aria-label="Back to home">
    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M13 8H3M3 8L7 4M3 8L7 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Back
  </a>

  <!-- Main Content -->
  <div class="page-wrapper">

    <!-- Header -->
    <header class="page-header">
      <div class="header-eyebrow">Choose Your Action</div>
      <h1 class="page-title">What would you<br>like to do?</h1>
      <p class="page-subtitle">Select an option below to get started with TaskForge's AI-powered workspace.</p>
    </header>

    <!-- 3 Action Buttons -->
    <div class="buttons-grid" role="list">

      <!-- Upload -->
      <a href="#upload" class="action-card card-upload" id="btn-upload" role="listitem" aria-label="Upload documents">
        <img class="action-img" src="./upload_btn.jpg" alt="Upload 3D button — upload your documents" draggable="false">
        <div class="action-label">
          <div class="label-left">
            <div class="label-icon">
              <!-- Upload icon -->
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M12 12V4m0 0L8 8m4-4l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="label-text-group">
              <span class="label-title">Upload</span>
              <span class="label-desc">Import documents, PDFs, or data files</span>
            </div>
          </div>
          <div class="label-arrow">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </a>

      <!-- Chat AI -->
      <a href="#chat" class="action-card card-chat" id="btn-chat-ai" role="listitem" aria-label="Chat with AI">
        <img class="action-img" src="./chatai_btn.jpg" alt="Chat AI 3D button — talk to the AI assistant" draggable="false">
        <div class="action-label">
          <div class="label-left">
            <div class="label-icon">
              <!-- Robot / AI icon -->
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="11" width="18" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
                <path d="M8 11V8a4 4 0 118 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <circle cx="9" cy="16" r="1.2" fill="currentColor"/>
                <circle cx="15" cy="16" r="1.2" fill="currentColor"/>
                <path d="M12 3v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="label-text-group">
              <span class="label-title">Chat AI</span>
              <span class="label-desc">Get instant answers from your AI assistant</span>
            </div>
          </div>
          <div class="label-arrow">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </a>

      <!-- Documents -->
      <a href="#documents" class="action-card card-docs" id="btn-documents" role="listitem" aria-label="Browse Documents">
        <img class="action-img" src="./documents_btn.jpg" alt="Documents 3D button — browse your document library" draggable="false">
        <div class="action-label">
          <div class="label-left">
            <div class="label-icon">
              <!-- Folder icon -->
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="label-text-group">
              <span class="label-title">Documents</span>
              <span class="label-desc">Browse and manage your document library</span>
            </div>
          </div>
          <div class="label-arrow">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </a>

    </div>
  </div>

  <script>
    // Ripple effect on card click
    document.querySelectorAll('.action-card').forEach(card => {
      card.addEventListener('click', function(e) {
        const ripple = document.createElement('span');
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height) * 2;
        ripple.style.cssText = `
          position:absolute;
          border-radius:50%;
          width:${size}px;
          height:${size}px;
          left:${e.clientX - rect.left - size/2}px;
          top:${e.clientY - rect.top - size/2}px;
          background:rgba(255,255,255,0.07);
          pointer-events:none;
          transform:scale(0);
          animation:ripple-anim 0.55s ease-out forwards;
          z-index:20;
        `;
        this.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      });
    });
  </script>

  <style>
    @keyframes ripple-anim {
      to { transform: scale(1); opacity: 0; }
    }
  </style>

</body>
</html>
