<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnboardAI - Interactive 3D Scroll Experience</title>
  <meta name="description" content="OnboardAI: Where onboarding meets intelligence. Experience our interactive 3D scroll page with instant policy answers & citation search.">
  <link rel="stylesheet" href="./style.css">
  <!-- Include Google Fonts Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Sticky Navbar (appears after scrolling) -->
  <nav class="sticky-nav" id="sticky-nav" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <div class="nav-brand">
        <svg class="nav-sparkle" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L14.8 9.2L22 12L14.8 14.8L12 22L9.2 14.8L2 12L9.2 9.2L12 2Z" fill="url(#nav-sparkle-grad)" />
          <defs>
            <linearGradient id="nav-sparkle-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#00f2fe" />
              <stop offset="100%" stop-color="#4facfe" />
            </linearGradient>
          </defs>
        </svg>
        <span class="nav-logo-text">TASKFORGE</span>
      </div>
      <div class="nav-links">
        <a class="nav-link" href="#" id="nav-product">Product</a>
        <a class="nav-link" href="#" id="nav-solutions">Solutions</a>
        <a class="nav-link" href="#" id="nav-about">About</a>
      </div>
      <button class="nav-cta" id="get-started-btn" aria-label="Get Started">
        <span class="nav-cta-text">GET STARTED</span>
        <svg class="nav-cta-arrow" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Preloader Screen -->
  <div id="preloader">
    <div class="loader-content">
      <div class="loader-logo">
        <svg class="sparkle-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L14.8 9.2L22 12L14.8 14.8L12 22L9.2 14.8L2 12L9.2 9.2L12 2Z" fill="url(#sparkle-grad)" />
          <defs>
            <linearGradient id="sparkle-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#00f2fe" />
              <stop offset="100%" stop-color="#4facfe" />
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">OnboardAI</span>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-status">
        <span id="progress-percentage">0%</span>
        <span class="status-msg" id="status-msg">Initializing workspace...</span>
      </div>
    </div>
  </div>

  <!-- Interactive 3D Canvas Background -->
  <div class="canvas-container">
    <canvas id="scroll-canvas"></canvas>
  </div>

  <!-- Hero Scroll Section Overlay -->
  <div class="scroll-wrapper" id="hero-section">
    <div class="hero-content">
      <h1 class="hero-headline">TASKFORGE</h1>
      <p class="hero-subheadline">TURN COMPLEX PROJECT INTO SEAMLESS EXECUTION</p>
    </div>
  </div>

  <!-- Scroll Timeline Spacer for 3D Animation (300vh height) -->
  <div class="scroll-spacer"></div>

  <!-- Scrollable Content Section below scroll animation -->
  <main class="content-section">
    <!-- Mockup Image from code.html -->
    <div class="mockup-container">
      <div class="mockup-glow"></div>
      <img alt="Neuralis Workspace 3D Mockup" class="mockup-image" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEkvRPasDkvfcR4i9OcGb1Ps33RflB8p_-K_yoSQ8tBhdXiXI9NZNV6l_ZmH5ldZqgjxv1Lrb214l3tJxrANLryIxx0VtiOh2h75RXsyNaYq_XBrvRn2wxrZVPynoo2AcHzCZhl_-sjZCL4oFFPovZJbEtmLLKc39eycldQ2K9Zv-OHwRjHl-jssl0LNwzEdTgN_5TfyZzmYbk0uOfeXfKDI32NiW8CZAY9ve17Nrsaebqc-gL2Vz9lA"/>
    </div>
  </main>

  <!-- Footer from code.html -->
  <footer class="custom-footer">
    <div class="footer-inner">
      <span class="footer-brand">NEURALIS</span>
      <div class="footer-links">
        <a class="footer-link" href="#">Product</a>
        <a class="footer-link" href="#">Solutions</a>
        <a class="footer-link" href="#">Intelligence</a>
        <a class="footer-link" href="#">Security</a>
        <a class="footer-link" href="#">Privacy</a>
      </div>
      <p class="footer-copy">
        © 2024 Neuralis AI Workspace. All rights reserved.
      </p>
    </div>
  </footer>

  <!-- Scroll Down Indicator (Intro Helper) -->
  <div class="scroll-indicator" id="scroll-indicator">
    <div class="mouse-icon">
      <span class="mouse-wheel"></span>
    </div>
    <span class="scroll-text">Scroll to explore</span>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
